name: Lane
options:
  bundleIdPrefix: app.lane
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  LaneCore:
    path: LaneCore

targets:
  Lane:
    type: application
    platform: macOS
    sources:
      - path: Lane
        excludes:
          - "Resources/Fonts/*.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lane.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Lane/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lane/Lane.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
    dependencies:
      - package: LaneCore
        product: LaneCore
    info:
      path: Lane/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Lzzzs."
        ATSApplicationFontsPath: "Fonts"
        NSPrincipalClass: NSApplication

schemes:
  Lane:
    build:
      targets:
        Lane: all
    run:
      config: Debug
      executable: Lane
    archive:
      config: Release
